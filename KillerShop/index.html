<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазин убийцы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="shake" class="stage-pad">

      <!-- HEADER -->
      <header class="hdr">
        <div class="hdr-title">Магазин убийцы</div>
        <div class="hdr-actions">
          <a class="debug-btn home-btn" href="../" title="Вернуться на главную">⌂ На главную</a>
          <label class="vol" title="Громкость звука">
            <input type="range" id="vol-range" min="0" max="100" step="5" value="30">
            <span class="vol-val" id="vol-val">30%</span>
          </label>
          <button id="btn-sound" class="debug-btn" type="button">Звук: вкл</button>
          <button id="btn-debug" class="debug-btn" type="button">⚙ Debug</button>
        </div>
        <div class="wallet">
          <img src="assets/Auric_Cell.png" class="wallet-icon" alt="cell">
          <div id="cells" class="wallet-num">0</div>
          <div id="cells-delta" class="wallet-delta"></div>
          <div id="floaters"></div>
        </div>
      </header>

      <div class="cols">

        <!-- LEFT: ROULETTE -->
        <section class="left">
          <div class="machine">
            <div class="noise"></div>
            <div id="lamps" class="lamps p0"></div>
            <div class="machine-head">
              <div class="machine-title">Дьявольская рулетка</div>
              <div id="result" class="machine-result">Крути барабан</div>
            </div>
            <div class="reel-zone">
              <div id="reel" class="reel">
                <div class="reel-col"><div class="reel-strip"></div><div class="reel-fade"></div></div>
                <div class="reel-col"><div class="reel-strip"></div><div class="reel-fade"></div></div>
                <div class="reel-col"><div class="reel-strip"></div><div class="reel-fade"></div></div>
                <div class="reel-col"><div class="reel-strip"></div><div class="reel-fade"></div></div>
              </div>
              <div class="marker-line"></div>
              <div class="marker-arrow left"></div>
              <div class="marker-arrow right"></div>
              <div id="reel-lock" class="reel-lock">
                <div class="lock-title">⚷ Рулетка запечатана</div>
                <div class="lock-sub">Продайте перки выжившим, чтобы снять печать · <span id="lock-count">0 / 3</span></div>
                <div class="lock-bar"><div id="lock-fill" class="lock-fill"></div></div>
              </div>
            </div>
            <div id="roll-btns" class="roll-btns"></div>
            <div class="sell">
              <div class="sell-title">Продажа перков</div>
              <div class="sell-row">
                <div id="sell-btns" class="sell-btns"></div>
                <button id="sell-choice" class="sell-choice" type="button">
                  <div id="sc-label" class="sc-label">Продать право на выбор карты</div>
                  <div id="sc-reward" class="sc-reward"></div>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- RIGHT: SURVIVORS + KILLER -->
        <section class="right">
          <div class="surv-panel">
            <div class="surv-head">
              <div class="surv-title">Выжившие</div>
              <div class="surv-hint">Тащите перк на такой же тир - объединение</div>
            </div>
            <div id="surv-rows" class="surv-rows"></div>
          </div>
          <div id="killer-panel" class="killer-panel"></div>
        </section>
      </div>
    </div>

    <div id="overlay"></div>
    <div id="flash"></div>
    <div id="particles"></div>
    <div id="toast"></div>
  </div>
</div>
<!-- Generated by tools/generate_data.py - defines window.SHOP_DATA -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
