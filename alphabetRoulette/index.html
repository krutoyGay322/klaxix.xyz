<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рулетка навыков — алфавит</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <div class="title">Рулетка навыков</div>
    <a class="ctl-btn home-btn" href="../" title="Вернуться на главную">⌂ На главную</a>
    <div class="hdr-actions">
      <button id="btn-perklist" class="ctl-btn" type="button">Список перков</button>
      <label class="vol" title="Громкость звука">
        <input type="range" id="vol-range" min="0" max="100" step="5" value="30">
        <span class="vol-val" id="vol-val">30%</span>
      </label>
      <button id="btn-sound" class="ctl-btn" type="button">Звук: вкл</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="roll-row">
    <button class="roll-btn" id="rollBtn" type="button">Крутить</button>
  </div>
</div>
<script src="js/perks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
